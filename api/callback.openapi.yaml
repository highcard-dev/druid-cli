openapi: 3.1.0
info:
  title: Druid Internal Callback API
  version: 0.1.0
  description: Internal callback API used by workers and dev servers.
servers:
  - url: /
tags:
  - name: worker
paths:
  /internal/v1/workers/{runtime_id}/progress:
    post:
      operationId: reportWorkerProgress
      tags: [worker]
      summary: Report progress for a pending worker action
      parameters:
        - $ref: '#/components/parameters/Runtime'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkerProgress'
      responses:
        '204':
          description: Worker progress accepted
        '400':
          description: Invalid worker progress
        '401':
          description: Invalid workload identity
        '409':
          description: Worker action is no longer pending
  /internal/v1/workers/{runtime_id}/complete:
    post:
      operationId: completeWorker
      tags: [worker]
      summary: Complete a pending worker action
      parameters:
        - $ref: '#/components/parameters/Runtime'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkerResult'
      responses:
        '204':
          description: Worker result accepted
        '400':
          description: Invalid worker result
        '401':
          description: Invalid workload identity
components:
  parameters:
    Runtime:
      name: runtime_id
      in: path
      required: true
      schema:
        type: string
  schemas:
    WorkerProgress:
      type: object
      required: [percentage]
      properties:
        percentage:
          type: integer
          format: int64
          minimum: 0
          maximum: 100
    WorkerResult:
      type: object
      properties:
        scroll_yaml:
          type: string
        artifact_digest:
          type: string
        error:
          type: string
